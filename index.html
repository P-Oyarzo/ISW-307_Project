<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CineGo - Buscador de películas con TMDB API">
    <meta name="theme-color" content="#1a1a2e">

    <title>CineGo - Buscador de Películas</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">🎬 CineGo</h1>
            <nav class="nav">
                <button class="nav-btn active" data-view="search">Buscar</button>
                <button class="nav-btn" data-view="favorites">Favoritos</button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <!-- Search View -->
        <section id="search-view" class="view active">
            <div class="container">
                <div class="search-box">
                    <input
                        type="text"
                        id="search-input"
                        class="search-input"
                        placeholder="Buscar películas..."
                        autocomplete="off"
                    >
                    <button id="search-btn" class="search-btn">Buscar</button>
                </div>

                <div id="search-results" class="movies-grid"></div>
                <div id="loading" class="loading hidden">Cargando...</div>
                <div id="error-message" class="error-message hidden"></div>
            </div>
        </section>

        <!-- Favorites View -->
        <section id="favorites-view" class="view">
            <div class="container">
                <h2 class="section-title">Mis Favoritos</h2>
                <div id="favorites-grid" class="movies-grid"></div>
                <p id="no-favorites" class="no-favorites hidden">
                    No tienes películas favoritas todavía.
                </p>
            </div>
        </section>
    </main>

    <!-- Movie Modal -->
    <div id="movie-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('Service Worker registrado:', reg))
                    .catch(err => console.log('Error al registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
